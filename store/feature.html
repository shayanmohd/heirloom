<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Display"; src: url("display.ttf"); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; color: #FDF6E4; font-family: "Display", Georgia, serif;
    background:
      radial-gradient(46% 92% at 24% 50%, rgba(255, 226, 162, 0.34), rgba(231, 174, 78, 0) 62%),
      radial-gradient(122% 150% at 26% 32%, #9C6A18 0%, #6E4710 40%, #3D2306 76%, #1F1202 100%);
  }
  /* the same fine grain the app carries on its paper */
  .grain { position: absolute; inset: 0; opacity: 0.09; mix-blend-mode: overlay;
    background-image: repeating-radial-gradient(circle at 26% 50%, rgba(255,244,214,0.9) 0 0.7px, transparent 0.7px 3.2px); }
  .vignette { position: absolute; inset: 0;
    background: radial-gradient(78% 108% at 32% 46%, rgba(0,0,0,0) 46%, rgba(20, 11, 1, 0.52) 100%); }
  svg.grainrings { position: absolute; left: -150px; top: -196px; width: 892px; height: 892px; opacity: 0.16; }
  svg.mark { position: absolute; left: 58px; top: 66px; width: 368px; height: 368px; }
  .rule { position: absolute; left: 478px; top: 140px; width: 78px; height: 5px; border-radius: 3px;
          background: linear-gradient(90deg, #FFFAEC, #D79E36); }
  .copy { position: absolute; left: 476px; top: 160px; width: 512px; }
  h1 { margin: 0; font-size: 114px; line-height: 1; letter-spacing: -0.025em; font-weight: 700;
       text-shadow: 0 8px 36px rgba(20, 11, 1, 0.6); }
  p { margin: 24px 0 0 4px; font-size: 33px; line-height: 1.26; color: #F4D387; max-width: 424px; }
</style>
</head>
<body>
  <div class="grain"></div>
  <svg class="grainrings" viewBox="0 0 108 108" aria-hidden="true"></svg>
  <div class="vignette"></div>
  <svg class="mark" viewBox="18 18 72 72" aria-hidden="true"></svg>
  <div class="rule"></div>
  <div class="copy">
    <h1>Heirloom</h1>
    <p>One question a week, kept in their own voice.</p>
  </div>
<script>
/* The mark and the grain behind it are the icon file itself, so the two never drift apart. */
fetch('icon.svg').then(r => r.text()).then(t => {
  const doc = new DOMParser().parseFromString(t, 'image/svg+xml');
  const mark = document.querySelector('svg.mark');
  const rings = document.querySelector('svg.grainrings');
  const bg = doc.getElementById('bg');
  bg.querySelectorAll('rect').forEach(r => r.remove());
  rings.appendChild(bg);
  mark.appendChild(doc.querySelector('defs'));
  mark.appendChild(doc.getElementById('fg'));
});
</script>
</body>
</html>
